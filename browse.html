<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browse Donations | Jisr El-Khair</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages/browse.css">
</head>

<body>

<header>

    <div class="logo">
        <img src="assets/images/logo/logo.png" alt="Jisr El-Khair Logo">
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="browse.html">Browse</a>
        <a href="donate.html">Donate</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>

        <div class="language-selector">

    🌐

    <select id="language">

        <option value="en">English</option>

        <option value="fr">Français</option>

        <option value="ar">العربية</option>

    </select>

</div>
    </nav>

</header>


<main>

<section class="browse-hero">

    <div class="overlay"></div>

    <div class="hero-content">

        <h1>Browse Donations</h1>

        <p>
            Discover free items shared by generous people across Algeria
        </p>

    </div>

</section>


<section class="filters">

    <input
        type="text"
        placeholder="🔍 Search items...">

    <select>
        <option>All Categories</option>
        <option>Clothes</option>
        <option>Furniture</option>
        <option>Books</option>
        <option>Electronics</option>
        <option>Toys</option>
    </select>

    <select>
        <option>Choose Wilaya</option>
    </select>

    <select>
        <option>Choose Commune</option>
    </select>

    <button class="primary">
        Search
    </button>

</section>



<section class="items-grid">

<div class="item-card">

    <div class="item-image">

        📷

        <span class="status available">
            Available
        </span>

    </div>

    <div class="item-content">

        <h3>Winter Jacket</h3>

        <p>📍 Algiers</p>

        <p>Condition: Excellent</p>

        <div class="card-buttons">

            <button class="favorite">
                🤍
            </button>

            <button class="primary">
                View Details
            </button>

        </div>

    </div>

</div>



<div class="item-card">

    <div class="item-image">

        📚

        <span class="status available">
            Available
        </span>

    </div>

    <div class="item-content">

        <h3>School Books</h3>

        <p>📍 Oran</p>

        <p>Condition: Good</p>

        <div class="card-buttons">

            <button class="favorite">
                🤍
            </button>

            <button class="primary">
                View Details
            </button>

        </div>

    </div>

</div>



<div class="item-card">

    <div class="item-image">

        🛋️

        <span class="status reserved">
            Reserved
        </span>

    </div>

    <div class="item-content">

        <h3>Sofa</h3>

        <p>📍 Blida</p>

        <p>Condition: Very Good</p>

        <div class="card-buttons">

            <button class="favorite">
                🤍
            </button>

            <button class="primary">
                View Details
            </button>

        </div>

    </div>

</div>

</section>

</main>
<script src="js/language.js"></script>
</body>

</html>
